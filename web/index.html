<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Alhussein Aldali — senior Flutter developer portfolio: projects, about, contact, and interactive demos.">

  <!--
    Link preview (WhatsApp, Telegram, Slack, Discord, iMessage, LinkedIn, etc.)
    uses Open Graph + Twitter tags. Replace EVERY https://YOUR_DOMAIN with your
    real HTTPS URL after deploy. og:image must be an absolute URL (not a path).
    Recommended image: ~1200×630px, <8MB, JPG or PNG — put in web/ and reference it.
    Re-scrape after changes: developers.facebook.com/tools/debug (Meta),
    cards-dev.twitter.com/validator, www.linkedin.com/post-inspector/
  -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Alhussein Aldali">
  <meta property="og:title" content="Alhussein Aldali · Flutter portfolio">
  <meta property="og:description" content="Senior Flutter developer — architecture, production apps, and Flutter web. Explore projects and get in touch.">
  <meta property="og:url" content="https://alhussienaldali.github.io/">
  <meta property="og:image" content="https://alhussienaldali.github.io/og-preview.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1024">
  <meta property="og:image:height" content="538">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Alhussein Aldali · Flutter portfolio">
  <meta name="twitter:description" content="Senior Flutter developer — architecture, production apps, and Flutter web.">
  <meta name="twitter:image" content="https://alhussienaldali.github.io/og-preview.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="alhussein_aldali_portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Alhussein Aldali · Flutter portfolio</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
